<!DOCTYPE html>
<html lang="ja-JP">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=0">
<title>𝐋𝐕𝐎 ♱⃓ᛪ༙ Holdings</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--white:#fff;--dim:rgba(255,255,255,0.5);--dimmer:rgba(255,255,255,0.25);}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Times New Roman',Georgia,serif;cursor:none;user-select:none;}
#stage{position:fixed;inset:0;z-index:0;background:#040006;}
#stage canvas{width:100%!important;height:100%!important;}
#title{position:fixed;top:0;left:0;right:0;z-index:30;padding:28px 40px;}
#title a{text-decoration:none;color:var(--white);font-size:13px;letter-spacing:0.3em;display:inline-flex;align-items:center;position:relative;}
#title-indicator{display:inline-block;width:60px;height:1px;background:var(--white);margin-left:12px;transform-origin:left center;transform:scaleX(0.75);transition:transform 0.4s;}
#title a:hover #title-indicator{transform:scaleX(1);}
#stage-nav{position:fixed;top:50%;left:0;right:0;z-index:30;transform:translateY(-50%);overflow:hidden;pointer-events:none;}
#screen-page-nav{display:flex;list-style:none;transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);will-change:transform;}
#screen-page-nav li{flex-shrink:0;display:flex;align-items:center;justify-content:center;pointer-events:all;}
#screen-page-nav li a{text-decoration:none;color:var(--white);font-size:clamp(32px,5vw,68px);letter-spacing:0.02em;line-height:1;display:block;padding:0 20px;transition:opacity 0.4s;white-space:nowrap;font-family:'IM Fell English',Georgia,serif;font-style:italic;}
#screen-page-nav li a{opacity:0.3;}
#screen-page-nav li.is-current a{opacity:1;}
#screen-page-nav li:hover a{opacity:0.7;}
#screen-page-nav li.lvo-about{display:flex;align-items:center;justify-content:center;}
#screen-page-nav li.lvo-about .about-inner{text-align:center;opacity:0.85;}
#screen-page-nav li.lvo-about .about-inner .lvo-big{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:clamp(48px,7vw,96px);color:var(--white);letter-spacing:0.08em;line-height:1;display:block;}
#screen-page-nav li.lvo-about .about-inner .lvo-sub{font-size:11px;letter-spacing:0.4em;color:var(--dimmer);display:block;margin-top:10px;}
#progress-indicator{position:fixed;top:0;left:0;z-index:40;height:1px;background:var(--white);width:100%;transform-origin:left center;transform:scaleX(0);}
#screen-controller{position:fixed;bottom:0;left:50%;z-index:30;transform:translateX(-50%);padding-bottom:20px;pointer-events:all;}
#screen-controller .inner{position:relative;display:flex;align-items:flex-end;}
#knob{position:absolute;bottom:0;left:0;display:flex;align-items:flex-end;transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);pointer-events:none;z-index:2;}
.separator{display:block;width:1px;height:16px;background:var(--white);position:relative;bottom:-1px;}
.denominator{font-size:11px;color:var(--dimmer);letter-spacing:0.1em;padding-left:6px;line-height:1;position:relative;bottom:3px;}
#controller-parent{list-style:none;display:flex;align-items:flex-end;border-bottom:0.5px solid rgba(255,255,255,0.2);}
#controller-parent li{cursor:pointer;}
.numerator{display:block;font-size:11px;letter-spacing:0.1em;color:var(--dimmer);padding:0 8px 8px;transition:color 0.3s;line-height:1;}
#controller-parent li.is-current .numerator{color:var(--white);}
#waiting-cover-cursor{position:fixed;pointer-events:none;z-index:900;width:52px;height:52px;margin-left:-26px;margin-top:-26px;}
#waiting-cover-cursor .inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#waiting-cover-cursor img{width:26px;height:26px;animation:spin 1.8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="stage"><canvas></canvas></div>

<div id="title">
  <a href="https://wearelvo.com/" id="title-link">
    <span style="letter-spacing:0.3em;">Legion V. Omni-Operations</span>
    <span id="title-indicator"></span>
  </a>
</div>

<span id="progress-indicator"></span>

<div id="stage-nav">
  <ul id="screen-page-nav">
    <li data-idx="0"><a href="https://vindex.wearelvo.com/">Vindex</a></li>
    <li data-idx="1"><a href="https://alliance.wearelvo.com/">Alliance</a></li>
    <li data-idx="2"><a href="https://ops.wearelvo.com/">Operations</a></li>
    <li data-idx="3"><a href="https://contact.wearelvo.com/">Connect</a></li>
    <li class="lvo-about" data-idx="4">
      <div class="about-inner">
        <span class="lvo-big">LVO</span>
        <span class="lvo-sub">LEGION V. OMNI-OPERATIONS</span>
      </div>
    </li>
  </ul>
</div>

<div id="screen-controller">
  <div class="inner">
    <div id="knob">
      <span class="separator"></span>
      <span class="denominator">5</span>
    </div>
    <ul class="nav-group" id="controller-parent">
      <li class="nav-list controller-item is-current" data-idx="0"><span class="numerator">1</span></li>
      <li class="nav-list controller-item" data-idx="1"><span class="numerator">2</span></li>
      <li class="nav-list controller-item" data-idx="2"><span class="numerator">3</span></li>
      <li class="nav-list controller-item" data-idx="3"><span class="numerator">4</span></li>
      <li class="nav-list controller-item" data-idx="4"><span class="numerator">5</span></li>
    </ul>
  </div>
</div>

<div id="waiting-cover-cursor" style="opacity:0;left:50%;top:50%;">
  <div class="inner">
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAAaABoDASIAAhEBAxEB/8QAGwAAAQQDAAAAAAAAAAAAAAAABAUGBwgAAgP/xAAsEAACAgECBQIEBwAAAAAAAAABAgMEBQARBhIhQVEHExQxMoFDYWJxoeHx/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/AKz47EYrh3hutxFxDX+Mt3gWx2PJ2UoPxZP0+B3+/RNn40zTsVhNStB2ghrIEA8dQT/Olv16VofUKWguwq06leGqB8hH7Skbfdm0wdA4Y5KWfBgetDTyOxMckQ5UlPgjsfz/AM0gOrI7I4Ksp2IPY62ru8ViOSPcOjBl28g6f09HGyTySOiczMS3TuToD7NMep3C1CxjJI24rxFYVrNR3CtdgX6JE3+bDuP63je9QvULJrXqdirOp2Mc0ZRgf2OuVaeerYSxWmkgmjPMkkbFWU+QR1B1YXiS5buejmKsW7U9iZrUZMkshZifbk7nroIOxlH4XlyORUxQxnmRG6NK3YAeNAz37Us8kpmZS7Ftgeg3Osycsst2QyyPIQxA5mJ2GhdB/9k=" alt="">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const GITHUB_RAW = 'https://raw.githubusercontent.com/lvoholdings00-sys/lvoooholdings/main/assets/';

const SLIDES = [
  { label:'Vindex',     img: GITHUB_RAW + 'vindex.jpg'    },
  { label:'Alliance',   img: GITHUB_RAW + 'alliance.jpg'  },
  { label:'Operations', img: GITHUB_RAW + 'operations.jpg'},
  { label:'Connect',    img: null                          },
  { label:'LVO',        img: null                          },
];
const TOTAL = SLIDES.length;

// THREE setup
const canvas = document.querySelector('#stage canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const geo = new THREE.PlaneGeometry(2,2);

const vertSrc = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position,1.0); }
`;

const fragSrc = `
precision highp float;
uniform float uTime;
uniform float uIndex;
uniform float uBlend;
uniform float uPrev;
uniform sampler2D uTexA;   // current slide texture
uniform sampler2D uTexB;   // previous slide texture
uniform int uHasTexA;
uniform int uHasTexB;
varying vec2 vUv;

// noise utils
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=0.5; }
  return v;
}

vec3 fallbackColor(float idx){
  if(idx<0.5) return vec3(0.04,0.05,0.18);
  if(idx<1.5) return vec3(0.03,0.06,0.12);
  if(idx<2.5) return vec3(0.05,0.03,0.14);
  if(idx<3.5) return vec3(0.02,0.03,0.10);
  return              vec3(0.04,0.02,0.12);
}

void main(){
  vec2 uv = vUv;
  float t = uTime;

  // Displacement field
  vec2 q = vec2(fbm(uv*4.0 + vec2(0.0, t*0.07)),
                fbm(uv*4.0 + vec2(5.2, t*0.05)));
  vec2 disp = vec2(fbm(uv*5.6 + 4.0*q + vec2(1.7,9.2) + 0.15*t),
                   fbm(uv*5.6 + 4.0*q + vec2(8.3,2.8) + 0.126*t));
  vec2 warpedUv = uv + 0.07 * disp;
  warpedUv = clamp(warpedUv, 0.0, 1.0);

  // Sample textures or use fallback color
  vec3 colA, colB;
  if(uHasTexA == 1){
    vec3 tex = texture2D(uTexA, warpedUv).rgb;
    // darken and tint
    colA = tex * 0.55;
  } else {
    float grd = 0.5 + 0.5*fbm(warpedUv*3.0 + t*0.04);
    vec3 fc = fallbackColor(uIndex);
    colA = fc * (0.5 + 0.5*grd) * 0.9 + fc * 0.3 * disp.x;
  }

  if(uHasTexB == 1){
    vec3 tex = texture2D(uTexB, warpedUv).rgb;
    colB = tex * 0.55;
  } else {
    float grd = 0.5 + 0.5*fbm(warpedUv*3.0 + t*0.04);
    vec3 fc = fallbackColor(uPrev);
    colB = fc * (0.5 + 0.5*grd) * 0.9 + fc * 0.3 * disp.y;
  }

  // Displacement-warped blend transition
  float blend = uBlend + 0.3*(disp.x - 0.5);
  blend = clamp(blend, 0.0, 1.0);
  vec3 col = mix(colB, colA, blend);

  // Glass cell overlay
  col += 0.03 * fbm(uv*12.0 + disp*0.5 + t*0.01);

  // Vignette
  vec2 vig = uv*2.0 - 1.0;
  col *= 1.0 - dot(vig,vig)*0.5;

  // Film grain
  col += hash(uv*997.0 + t*0.1)*0.035 - 0.0175;

  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}
`;

// Create a 1x1 white placeholder texture
function makePlaceholder(){
  const d = new Uint8Array([128,128,128,255]);
  const t = new THREE.DataTexture(d,1,1,THREE.RGBAFormat);
  t.needsUpdate = true;
  return t;
}

const placeholder = makePlaceholder();
const textures = new Array(TOTAL).fill(null);
const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

// Load images where available
SLIDES.forEach((s,i)=>{
  if(!s.img) return;
  loader.load(s.img, tex=>{
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearFilter;
    textures[i] = tex;
    // If this is the current slide, swap it in immediately
    if(i === current){
      uniforms.uTexA.value = tex;
      uniforms.uHasTexA.value = 1;
    }
  }, undefined, ()=>{
    // load error — stays null (uses fallback color)
  });
});

const uniforms = {
  uTime:   { value: 0 },
  uIndex:  { value: 0 },
  uPrev:   { value: 0 },
  uBlend:  { value: 1 },
  uTexA:   { value: placeholder },
  uTexB:   { value: placeholder },
  uHasTexA:{ value: 0 },
  uHasTexB:{ value: 0 },
};

const mat = new THREE.ShaderMaterial({ vertexShader:vertSrc, fragmentShader:fragSrc, uniforms });
scene.add(new THREE.Mesh(geo, mat));

function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
}
resize();
window.addEventListener('resize', resize);

// ─── NAV STATE ────────────────────────────────────────────────────────────
let current = 0;
let transitioning = false;
let transitionStart = 0;
const TRANS_DUR = 900;

const navUl  = document.getElementById('screen-page-nav');
const ctrlUl = document.getElementById('controller-parent');
const knob   = document.getElementById('knob');

function layoutNav(){
  const sw = window.innerWidth * 0.5;
  navUl.style.width = (sw * TOTAL) + 'px';
  Array.from(navUl.children).forEach(li=>{
    li.style.width = sw + 'px';
    li.style.minHeight = '80px';
  });
}
layoutNav();
window.addEventListener('resize', layoutNav);

function updateNav(idx){
  const sw = window.innerWidth * 0.5;
  const offset = sw * idx - (window.innerWidth/2 - sw/2);
  navUl.style.transform = `translateX(${-offset}px)`;

  Array.from(navUl.children).forEach((li,i)=>{
    li.classList.remove('is-current','is-prev','is-next');
    if(i===idx) li.classList.add('is-current');
    else if(i===idx-1) li.classList.add('is-prev');
    else if(i===idx+1) li.classList.add('is-next');
  });

  Array.from(ctrlUl.children).forEach((li,i)=>{
    li.classList.toggle('is-current', i===idx);
  });

  const itemW = ctrlUl.offsetWidth / TOTAL;
  knob.style.transform = `translateX(${idx * itemW}px)`;
}
updateNav(current);

function getTexForIdx(idx){
  return textures[idx] || null;
}

function goTo(idx){
  if(idx<0||idx>=TOTAL||transitioning||idx===current) return;
  transitioning = true;
  const prev = current;
  current = idx;

  // Swap textures
  const tA = getTexForIdx(idx);
  const tB = getTexForIdx(prev);
  uniforms.uTexB.value = tB || placeholder;
  uniforms.uHasTexB.value = tB ? 1 : 0;
  uniforms.uTexA.value = tA || placeholder;
  uniforms.uHasTexA.value = tA ? 1 : 0;
  uniforms.uPrev.value = prev;
  uniforms.uIndex.value = idx;
  uniforms.uBlend.value = 0;
  transitionStart = performance.now();

  updateNav(idx);
  resetProgress();
  setTimeout(()=>{ transitioning=false; }, TRANS_DUR+100);
}

// Initial texture setup for slide 0
setTimeout(()=>{
  const t = getTexForIdx(0);
  uniforms.uTexA.value = t || placeholder;
  uniforms.uHasTexA.value = t ? 1 : 0;
  uniforms.uIndex.value = 0;
}, 100);

// ─── INPUT ────────────────────────────────────────────────────────────────
Array.from(ctrlUl.children).forEach(li=>{
  li.addEventListener('click',()=>goTo(+li.dataset.idx));
});
Array.from(navUl.children).forEach(li=>{
  li.addEventListener('click',e=>{
    e.preventDefault();
    goTo(+li.dataset.idx);
  });
});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1);
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')   goTo(current-1);
});
let wCool=false;
window.addEventListener('wheel',e=>{
  if(wCool) return; wCool=true;
  if(e.deltaX>30||e.deltaY>30) goTo(current+1);
  else if(e.deltaX<-30||e.deltaY<-30) goTo(current-1);
  setTimeout(()=>wCool=false,900);
},{passive:true});
let dragX=0,dragging=false,dDelta=0;
window.addEventListener('pointerdown',e=>{ dragging=true;dragX=e.clientX;dDelta=0; });
window.addEventListener('pointermove',e=>{ if(dragging) dDelta=e.clientX-dragX; });
window.addEventListener('pointerup',()=>{
  if(!dragging) return; dragging=false;
  if(dDelta<-60) goTo(current+1);
  else if(dDelta>60) goTo(current-1);
  dDelta=0;
});

// ─── CURSOR ───────────────────────────────────────────────────────────────
const cursor = document.getElementById('waiting-cover-cursor');
window.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
  cursor.style.opacity='0.9';
});
window.addEventListener('mouseleave',()=>{ cursor.style.opacity='0'; });

// ─── RENDER ───────────────────────────────────────────────────────────────
function animate(ts){
  requestAnimationFrame(animate);
  uniforms.uTime.value = ts * 0.001;
  if(uniforms.uBlend.value < 1){
    const t = Math.min((ts - transitionStart) / TRANS_DUR, 1);
    uniforms.uBlend.value = 1-(1-t)*(1-t)*(1-t);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ─── AUTO-ADVANCE ─────────────────────────────────────────────────────────
const progressBar = document.getElementById('progress-indicator');
const AUTO_INTERVAL = 6000;
let progressStart = performance.now();
function resetProgress(){ progressStart = performance.now(); }
function tickProgress(ts){
  requestAnimationFrame(tickProgress);
  const frac = Math.min((ts - progressStart) / AUTO_INTERVAL, 1);
  progressBar.style.transform = `scaleX(${frac})`;
  if(frac >= 1){ progressStart = ts; goTo((current+1) % TOTAL); }
}
requestAnimationFrame(tickProgress);
</script>
</body>
</html>
