<script>
(function(){
  function getCookie(name){
    var m = document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  var consent = getCookie('lvo_motion_consent');
  window.__LVO_MOTION_CONSENT__ = consent;

  var justWarned = new URLSearchParams(location.search).get('warned') === '1';
  if(!justWarned){
    location.replace('https://warning.wearelvo.com/?return=' + encodeURIComponent(location.origin + location.pathname));
  } else if(window.history && history.replaceState){
    history.replaceState({}, '', location.pathname);
  }
})();
</script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--white:#fff;--dim:rgba(255,255,255,0.5);--dimmer:rgba(255,255,255,0.25);--purple:#7F77DD;--red-hi:#CC2020;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Times New Roman',Georgia,serif;user-select:none;}

@media (pointer:coarse){ body{cursor:auto;} }
@media (pointer:fine){ body{cursor:none;} }

#loading-screen{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;transition:opacity 0.8s ease;}
#loading-screen.fade-out{opacity:0;pointer-events:none;}
.ls-rule{width:1px;height:80px;background:linear-gradient(to bottom,transparent,var(--purple),transparent);animation:lsPulse 1.8s ease-in-out infinite;}
@keyframes lsPulse{0%,100%{opacity:.3}50%{opacity:1}}
.ls-name{font-family:'Cinzel',serif;font-size:2.8rem;font-weight:900;letter-spacing:.25em;color:#C8C8D0;line-height:1;}
.ls-sub{font-family:'Cormorant SC',serif;font-size:.48rem;letter-spacing:.5em;color:rgba(255,255,255,0.38);text-transform:uppercase;text-align:center;padding:0 1rem;}
.ls-bar{width:200px;height:1px;background:rgba(127,119,221,.2);overflow:hidden;position:relative;}
.ls-bar-fill{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--purple),transparent);animation:lsBar 1.4s ease-in-out infinite;}
@keyframes lsBar{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

#site-wrap{opacity:0;transition:opacity 0.8s ease;}
#site-wrap.visible{opacity:1;}

#stage{position:fixed;inset:-3%;z-index:0;background:transparent;will-change:transform;}
#stage canvas{width:100%!important;height:100%!important;display:block;}


#title{position:fixed;top:0;left:0;right:0;z-index:30;padding:clamp(14px,3vw,28px) clamp(16px,4vw,40px);}
#title a{text-decoration:none;color:var(--white);font-size:clamp(9px,2vw,13px);letter-spacing:0.3em;display:inline-flex;align-items:center;position:relative;}
#title-indicator{display:inline-block;width:40px;height:1px;background:var(--white);margin-left:12px;transform-origin:left center;transform:scaleX(0.75);transition:transform 0.4s;}
#title a:hover #title-indicator{transform:scaleX(1);}

#stage-nav{position:fixed;top:50%;left:0;right:0;z-index:30;transform:translateY(-50%);overflow:hidden;pointer-events:none;}
#screen-page-nav{display:flex;list-style:none;transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);will-change:transform;}
#screen-page-nav li{flex-shrink:0;display:flex;align-items:center;justify-content:center;pointer-events:all;}
#screen-page-nav li a{text-decoration:none;color:var(--white);font-size:clamp(22px,3.8vw,54px);letter-spacing:0.14em;text-transform:uppercase;font-weight:600;line-height:1;display:block;padding:0 clamp(8px,2vw,20px);white-space:nowrap;font-family:'Cinzel',Georgia,serif;text-shadow:0 2px 24px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6);}

#screen-page-nav li a {
  transition: opacity 0.4s ease, filter 0.55s ease;
}
#screen-page-nav li:not(.is-current) a {
  filter: blur(1.5px);
  opacity: 0.55;
}
#screen-page-nav li.is-current a {
  filter: blur(0px);
  opacity: 1;
}

@media(max-width:768px){
  #about-text{
    left:0 !important;
    right:0 !important;
    width:100%;
    bottom:auto;
    top:62%;
    transform:translateY(-50%);
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  #about-text.visible{ transform:translateY(-50%); }
  #about-text .about-lvo{ font-size:clamp(48px,12vw,72px); }


  #screen-page-nav li[data-idx="2"],
  #screen-page-nav li[data-idx="3"],
  #screen-page-nav li[data-idx="4"],
  #screen-page-nav li[data-idx="5"]{
    margin-top:22vh;
  }

  #stage-nav{ top:62%; bottom:auto; transform:translateY(-50%); height:auto; overflow:visible; }
  #screen-page-nav li{ height:auto; min-height:80px; pointer-events:all; align-items:center; justify-content:center; }

  #screen-page-nav li[data-idx="1"]{ align-items:center; justify-content:center; }
  #screen-page-nav li[data-idx="0"]{ pointer-events:none; }
}



.controller-item.is-symbol .numerator{font-size:clamp(11px,2vw,15px);letter-spacing:0;padding-bottom:6px;}
.controller-item.is-symbol.is-current .numerator{color:var(--white);}
.controller-item.is-symbol .numerator{color:var(--dimmer);}

#screen-controller{position:fixed;bottom:0;left:50%;z-index:30;transform:translateX(-50%);padding-bottom:clamp(12px,3vw,20px);pointer-events:all;}

#legal-links{position:fixed;bottom:clamp(12px,3vw,20px);right:clamp(16px,4vw,40px);z-index:30;display:flex;gap:1.2rem;pointer-events:all;}
#legal-links a{font-family:'Cinzel',serif;font-size:clamp(7px,1vw,9px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.35);text-decoration:none;border-bottom:0.5px solid rgba(139,0,0,0.3);padding-bottom:2px;transition:color .3s,border-color .3s;}
#legal-links a:hover{color:var(--white);border-color:var(--red-hi);}
@media(max-width:768px){
  #legal-links{left:50%;right:auto;transform:translateX(-50%);bottom:64px;gap:1rem;}
}
@media(max-width:600px){#legal-links{gap:0.7rem;}#legal-links a{font-size:7px;}}

#mode-toggle{position:fixed;top:0;right:0;z-index:35;padding:clamp(14px,3vw,28px) clamp(16px,4vw,40px);}
#mode-toggle button{font-family:'Cinzel',serif;font-size:clamp(8px,1vw,11px);font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,0.75);background:rgba(0,0,0,0.28);border:0.5px solid rgba(255,255,255,0.35);padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px);transition:border-color .3s,color .3s,background .3s;}
#mode-toggle button:hover{border-color:var(--purple);color:var(--white);background:rgba(127,119,221,0.12);}
@media(max-width:600px){#mode-toggle button{padding:8px 12px;font-size:8px;}}
#screen-controller .inner{position:relative;display:flex;align-items:flex-end;}
#knob{position:absolute;bottom:0;left:0;display:flex;align-items:flex-end;transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);pointer-events:none;z-index:2;}
.separator{display:block;width:1px;height:16px;background:var(--white);position:relative;bottom:-1px;}
.denominator{font-size:clamp(9px,2vw,11px);color:var(--dimmer);letter-spacing:0.1em;padding-left:6px;line-height:1;position:relative;bottom:3px;}
#controller-parent{list-style:none;display:flex;align-items:flex-end;border-bottom:0.5px solid rgba(255,255,255,0.2);}
#controller-parent li{cursor:pointer;}
.numerator{display:block;font-size:clamp(9px,2vw,11px);letter-spacing:0.1em;color:var(--dimmer);padding:0 clamp(5px,1.5vw,8px) 8px;transition:color 0.3s;line-height:1;}
#controller-parent li.is-current .numerator{color:var(--white);}

#trailing-cursor-canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:900;}

@media (max-width:768px){
  #stage{inset:0;transform:none!important;will-change:auto;}
  #title a span:first-child{display:none;}
  #title a::before{content:'LVO';font-family:'Cinzel',serif;font-size:13px;letter-spacing:.3em;color:var(--white);}
  #stage canvas{opacity:0.95;}
}

#about-text{
  position:fixed;
  bottom:clamp(80px,12vh,130px);
  left:clamp(40px,7vw,120px);
  z-index:30;
  pointer-events:all;
  opacity:0;
  transition:opacity 0.7s ease;
}
#about-text.visible{ opacity:1; }

@media(min-width:769px){
  #about-text{
    bottom:auto;
    top:50%;
    transform:translateY(-50%);
  }
  #about-text.visible{
    transform:translateY(-50%);
  }
}

#about-text .about-lvo{
  display:block;
  font-family:'Cinzel',serif;
  font-weight:900;
  font-size:clamp(32px,4.5vw,64px);
  letter-spacing:.18em;
  color:#fff;
  line-height:1;
  margin-bottom:1rem;
  text-shadow:0 2px 40px rgba(0,0,0,0.9);
  pointer-events:none;
}
.about-btn{
  display:inline-flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
  border:0.5px solid rgba(255,255,255,0.35);
  padding:12px 28px;
  font-family:'Cinzel',serif;
  font-size:clamp(8px,1vw,11px);
  font-weight:600;
  letter-spacing:.45em;
  color:rgba(255,255,255,0.85);
  text-transform:uppercase;
  background:rgba(0,0,0,0.28);
  backdrop-filter:blur(6px);
  transition:border-color 0.3s,color 0.3s,background 0.3s;
  cursor:pointer;
}
.about-btn:hover{
  border-color:var(--purple);
  color:#fff;
  background:rgba(127,119,221,0.12);
}
.about-btn-rule{
  display:inline-block;
  width:24px;
  height:1px;
  background:currentColor;
  opacity:0.5;
  transition:width 0.3s;
}
.about-btn:hover .about-btn-rule{ width:36px; }

#video-bg{
  position:fixed;inset:0;z-index:5;
  width:100%;height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 0.9s ease;
  pointer-events:none;
}
#video-bg.visible{ opacity:1; }
#stage{ z-index:10; background:#000; }
#stage.video-mode{
  z-index:4;
  background:transparent;
}
#stage.video-mode canvas{
  opacity:0;
}

/* ---------- mobile polish ---------- */
@supports(height:100dvh){ html,body{height:100dvh;} }
#title{padding-top:calc(clamp(14px,3vw,28px) + env(safe-area-inset-top,0px));}
#screen-controller{padding-bottom:calc(clamp(12px,3vw,20px) + env(safe-area-inset-bottom,0px));}

@media(max-width:768px){
  #legal-links{bottom:calc(64px + env(safe-area-inset-bottom,0px));}
  #legal-links a{font-size:9px;padding:8px 0;white-space:nowrap;}
}

/* ---------- top-right logo + menu ---------- */
#top-right{
  position:fixed;z-index:60;display:flex;align-items:center;gap:2px;
  top:calc(env(safe-area-inset-top,0px) + clamp(6px,1.6vw,18px));
  right:clamp(6px,2.4vw,28px);
}
#top-logo{display:flex;align-items:center;justify-content:center;width:48px;height:48px;-webkit-tap-highlight-color:transparent;}
#top-logo img{width:34px;height:34px;display:block;filter:drop-shadow(0 0 8px rgba(0,0,0,.8));}
#menu-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:48px;height:48px;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#menu-btn span{display:block;width:24px;height:1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.7);transition:transform .35s ease,opacity .25s ease;}
#menu-btn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
#menu-btn.open span:nth-child(2){opacity:0;}
#menu-btn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
#menu-btn:focus-visible,#top-logo:focus-visible{outline:1px solid var(--purple);outline-offset:-4px;}

#site-menu{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4rem;
  padding:calc(env(safe-area-inset-top,0px) + 64px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:rgba(0,0,0,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  overflow-y:auto;opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility 0s linear .4s;
}
#site-menu.open{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s;}
#site-menu ul{list-style:none;display:flex;flex-direction:column;align-items:center;gap:.2rem;}
#site-menu li a{
  display:block;padding:12px 28px;color:#fff;text-decoration:none;text-align:center;
  font-family:'Cinzel','Cambria Math','Segoe UI Symbol',Georgia,serif;font-weight:600;
  font-size:clamp(20px,5.5vw,30px);letter-spacing:.16em;text-transform:uppercase;line-height:1.2;
  transition:color .25s;
}
#site-menu li a:hover,#site-menu li a:active,#site-menu li a:focus-visible{color:var(--purple);outline:none;}
#site-menu li:first-child{margin-bottom:.9rem;padding-bottom:.9rem;border-bottom:.5px solid rgba(127,119,221,.35);}
#site-menu li:first-child a{font-size:clamp(24px,6.5vw,36px);letter-spacing:.12em;}
#menu-mode-btn{
  font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.8);background:rgba(0,0,0,.28);border:.5px solid rgba(255,255,255,.35);
  padding:12px 20px;min-height:44px;cursor:pointer;transition:border-color .3s,color .3s;
}
#menu-mode-btn:hover{border-color:var(--purple);color:#fff;}
#site-menu .menu-legal{display:flex;gap:1.4rem;}
#site-menu .menu-legal a{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.5);text-decoration:none;padding:8px 0;
}
#site-menu .menu-legal a:hover{color:#fff;}

/* ---------- menu + logo: mobile only ---------- */
@media(min-width:769px){ #top-right,#site-menu{display:none !important;} }
@media(max-width:768px){
  #mode-toggle{display:none;}
  #screen-page-nav li a{font-size:clamp(22px,6vw,34px);}
}

/* ---------- desktop top nav ---------- */
#top-nav{display:none;}
@media(min-width:1100px){
  #top-nav{
    display:flex;position:fixed;z-index:31;left:50%;transform:translateX(-50%);
    top:calc(clamp(14px,3vw,28px) + env(safe-area-inset-top,0px) - 2px);
    gap:clamp(40px,6vw,110px);
  }
  #top-nav a{
    font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:rgba(255,255,255,.78);text-decoration:none;padding:6px 0 5px 0.32em;
    border-bottom:.5px solid rgba(139,0,0,.35);text-shadow:0 2px 14px rgba(0,0,0,.9);
    transition:color .3s,border-color .3s;
  }
  #top-nav a:hover,#top-nav a:focus-visible{color:#fff;border-color:var(--red-hi);outline:none;}
}
</style>

<script>
const isMobileDevice = window.innerWidth <= 768;
const isTablet = window.innerWidth > 768 && window.innerWidth <= 1024;

let WATER_INTENSITY = 0.028;
if (isMobileDevice) {
  WATER_INTENSITY = 0.015;
} else if (isTablet) {
  WATER_INTENSITY = 0.022;
}

const loadingScreen = document.getElementById('loading-screen');
const siteWrap      = document.getElementById('site-wrap');
function dismissLoader(){
  loadingScreen.classList.add('fade-out');
  siteWrap.classList.add('visible');
  setTimeout(()=>{ loadingScreen.style.display='none'; }, 900);
  startAutoAdvance();
}
setTimeout(dismissLoader, 2400);

const ASSETS = 'https://assets.wearelvo.com/';

function getImageUrl(desktopImg, mobileImg) {
  return isMobileDevice ? mobileImg : desktopImg;
}

const SLIDES = [
  { label:'About',      img: ASSETS+'LVO%20R.jpg',       mobile_img: ASSETS+'LVO%20Mobile%20R.jpg' },
  { label:'Connect',    img: ASSETS+'LVO.jpg',           mobile_img: ASSETS+'LVO%20Mobile.JPG' },
  { label:'Vindex',     img: ASSETS+'Vindex.jpg',        mobile_img: ASSETS+'Vindex%20Mobile.JPG' },
  { label:'Alliance',   img: ASSETS+'Alliance.JPG',      mobile_img: ASSETS+'Alliance%20Mobile.JPG' },
  { label:'Operations', img: ASSETS+'Operations.jpg',    mobile_img: ASSETS+'Operations%20Mobile.JPG' },
  { label:'Careers',    img: ASSETS+'Careers.JPG',       mobile_img: ASSETS+'Careers%20Mobile.JPG' },
];
const TOTAL = SLIDES.length;

const SECRET_SLIDE = { img: ASSETS+'LVOAL.jpg', mobile_img: ASSETS+'LVOAP.JPG' };
const SECRET_URL = 'https://about.wearelvo.com/';

const VIDEO_SLIDES = new Set([]);
const videoBg  = document.getElementById('video-bg');
const stageCanvas = document.querySelector('#stage');

function updateVideoBackground(idx){
  if(VIDEO_SLIDES.has(idx)){
    videoBg.classList.add('visible');
    stageCanvas.classList.add('video-mode');
    videoBg.play().catch(()=>{});
  } else {
    videoBg.classList.remove('visible');
    stageCanvas.classList.remove('video-mode');
    videoBg.pause();
  }
}
updateVideoBackground(0);

const canvas = document.querySelector('#stage canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileDevice ? 1.5 : 2));
const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const geo    = new THREE.PlaneGeometry(2,2);

const vertSrc = `
varying vec2 vUv;
void main(){ vUv=uv; gl_Position=vec4(position,1.0); }
`;

const fragSrc = `
precision highp float;
uniform float uTime;
uniform float uBlend;
uniform sampler2D uTexA;
uniform sampler2D uTexB;
uniform int uHasTexA;
uniform int uHasTexB;
uniform float uWaterIntensity;
varying vec2 vUv;

float wave(vec2 p, float freq, float phase){
  return sin(p.x * freq + uTime * 0.3 + phase)
       * cos(p.y * freq * 0.8 + uTime * 0.2 + phase * 1.3);
}

void main(){
  vec2 uv = vUv;

  float w1 = wave(uv, 2.8,  0.0);
  float w2 = wave(uv, 4.9,  2.1);
  float w3 = wave(uv * 1.3, 1.9, 4.3);
  float w4 = wave(uv * 0.6, 6.2, 1.7);

  vec2 disp;
  disp.x = (w1*0.5 + w2*0.3 + w3*0.15 + w4*0.05) * uWaterIntensity;
  disp.y = (w2*0.5 + w1*0.25 + w4*0.2  + w3*0.05) * uWaterIntensity;
  vec2 wuv = clamp(uv + disp, 0.0, 1.0);

  vec3 colA, colB;

  if(uHasTexA == 1){
    colA = texture2D(uTexA, wuv).rgb * 0.82;
  } else {
    colA = vec3(0.04, 0.02, 0.12);
  }

  if(uHasTexB == 1){
    colB = texture2D(uTexB, wuv).rgb * 0.82;
  } else {
    colB = vec3(0.04, 0.02, 0.12);
  }

  float spec = max(0.0, w1 * 0.3 + w2 * 0.2 + 0.2);
  vec3 sheen = vec3(0.55, 0.52, 0.72) * pow(spec, 6.0) * 0.18;

  vec3 col = mix(colB, colA, clamp(uBlend, 0.0, 1.0));
  col += sheen;

  vec2 vig = uv * 2.0 - 1.0;
  col *= 1.0 - dot(vig, vig) * 0.38;

  float grain = fract(sin(dot(uv * 997.0, vec2(12.9898, 78.233))) * 43758.5453);
  col += grain * 0.018 - 0.009;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function makePlaceholder(){
  const d=new Uint8Array([30,30,40,255]);
  const t=new THREE.DataTexture(d,1,1,THREE.RGBAFormat);
  t.needsUpdate=true; return t;
}

const placeholder = makePlaceholder();
const textures = new Array(TOTAL).fill(null);
const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';
let secretTexture = null;

let imagesAllowed = window.__LVO_MOTION_CONSENT__ !== 'denied';

function loadTex(url, onLoad){
  loader.load(url, tex=>{
    tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
    tex.minFilter=THREE.LinearFilter;
    onLoad(tex);
  });
}

function loadSlide(i){
  if(textures[i] || !imagesAllowed) return;
  loadTex(getImageUrl(SLIDES[i].img, SLIDES[i].mobile_img), tex=>{
    textures[i]=tex;
    if(i===current){
      uniforms.uTexA.value=tex;
      uniforms.uHasTexA.value=1;
    }
  });
}

function loadAllImages(){
  loadSlide(0);
  const rest = ()=>{
    for(let i=1;i<TOTAL;i++) loadSlide(i);
    if(!secretTexture && imagesAllowed){
      loadTex(getImageUrl(SECRET_SLIDE.img, SECRET_SLIDE.mobile_img), tex=>{ secretTexture = tex; });
    }
  };
  if('requestIdleCallback' in window) requestIdleCallback(rest,{timeout:3000});
  else setTimeout(rest,1500);
}

function clearAllImages(){
  for(let i=0;i<textures.length;i++) textures[i]=null;
  secretTexture = null;
  uniforms.uTexA.value = placeholder; uniforms.uHasTexA.value = 0;
  uniforms.uTexB.value = placeholder; uniforms.uHasTexB.value = 0;
}

const uniforms = {
  uTime:           {value:0},
  uBlend:          {value:1},
  uTexA:           {value:placeholder},
  uTexB:           {value:placeholder},
  uHasTexA:        {value:0},
  uHasTexB:        {value:0},
  uWaterIntensity: {value:WATER_INTENSITY},
};

scene.add(new THREE.Mesh(geo, new THREE.ShaderMaterial({vertexShader:vertSrc,fragmentShader:fragSrc,uniforms})));

if(imagesAllowed) loadAllImages();

function resize(){ renderer.setSize(window.innerWidth, window.innerHeight); }
resize();
window.addEventListener('resize', resize);

let current=0, transitioning=false, transitionStart=0, menuOpen=false;
const menuBtn = document.getElementById('menu-btn');
const mobileMenu = document.getElementById('site-menu');
function setMenu(open){
  menuOpen = open;
  menuBtn.classList.toggle('open', open);
  mobileMenu.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  if(open) mobileMenu.querySelector('a').focus({preventScroll:true});
}
menuBtn.addEventListener('click', ()=> setMenu(!menuOpen));
mobileMenu.addEventListener('click', e=>{ if(e.target.closest('a')) setMenu(false); });
window.addEventListener('keydown', e=>{ if(e.key==='Escape' && menuOpen){ setMenu(false); menuBtn.focus(); } });

const TRANS_DUR=900;
const navUl=document.getElementById('screen-page-nav');
const ctrlUl=document.getElementById('controller-parent');
const knob=document.getElementById('knob');

function layoutNav(){
  const isMobile = window.innerWidth <= 768;
  const sw = isMobile ? window.innerWidth : window.innerWidth * 0.5;
  navUl.dataset.sw = sw;
  navUl.style.width=(sw*TOTAL)+'px';
  Array.from(navUl.children).forEach(li=>{ li.style.width=sw+'px'; li.style.minHeight='80px'; });
}
layoutNav();
window.addEventListener('resize', layoutNav);

const aboutText = document.getElementById('about-text');
function updateAboutText(idx){
  if(idx === 0) aboutText.classList.add('visible');
  else aboutText.classList.remove('visible');
}
updateAboutText(0);

function updateNav(idx){
  const sw = parseFloat(navUl.dataset.sw) || window.innerWidth * 0.5;
  navUl.style.transform=`translateX(${-(sw*idx-(window.innerWidth/2-sw/2))}px)`;
  Array.from(navUl.children).forEach((li,i)=>{
    li.classList.toggle('is-current',i===idx);
  });
  Array.from(ctrlUl.children).forEach((li,i)=>li.classList.toggle('is-current',i===idx));
  knob.style.transform=`translateX(${idx*(ctrlUl.offsetWidth/TOTAL)}px)`;
}
updateNav(0);

function goTo(idx){
  if(menuOpen||idx<0||idx>=TOTAL||transitioning||idx===current) return;
  loadSlide(idx);
  transitioning=true;
  const prev=current; current=idx;
  const tA=textures[idx], tB=textures[prev];
  uniforms.uTexB.value=tB||placeholder; uniforms.uHasTexB.value=tB?1:0;
  uniforms.uTexA.value=tA||placeholder; uniforms.uHasTexA.value=tA?1:0;
  uniforms.uBlend.value=0;
  transitionStart=performance.now();
  updateNav(idx); resetProgress();
  updateVideoBackground(idx);
  updateAboutText(idx);
  setTimeout(()=>transitioning=false, TRANS_DUR+100);
}

function goToSecretAbout(){
  if(menuOpen || transitioning || current!==0) return;
  transitioning=true;
  const tB=textures[0];
  uniforms.uTexB.value=tB||placeholder; uniforms.uHasTexB.value=tB?1:0;
  uniforms.uTexA.value=secretTexture||placeholder; uniforms.uHasTexA.value=secretTexture?1:0;
  uniforms.uBlend.value=0;
  transitionStart=performance.now();
  aboutText.classList.remove('visible');
  resetProgress();
  setTimeout(()=>{ window.location.href = SECRET_URL; }, TRANS_DUR+80);
}

document.getElementById('about-btn').addEventListener('click', e=>{
  e.preventDefault();
  goToSecretAbout();
});

const modeToggleBtn = document.getElementById('mode-toggle-btn');
const menuModeBtn = document.getElementById('menu-mode-btn');
function updateModeToggleLabel(){
  const label = imagesAllowed ? 'Disable Images' : 'Enable Images';
  modeToggleBtn.textContent = label;
  menuModeBtn.textContent = label;
}
function setImagesAllowed(allowed){
  imagesAllowed = allowed;
  document.cookie = 'lvo_motion_consent=' + (allowed?'accepted':'denied') + '; domain=.wearelvo.com; path=/; max-age=' + (60*60*24*365) + '; SameSite=Lax';
  window.__LVO_MOTION_CONSENT__ = allowed ? 'accepted' : 'denied';
  updateModeToggleLabel();
  if(allowed) loadAllImages(); else clearAllImages();
}
updateModeToggleLabel();
modeToggleBtn.addEventListener('click', ()=> setImagesAllowed(!imagesAllowed));
menuModeBtn.addEventListener('click', ()=> setImagesAllowed(!imagesAllowed));

Array.from(ctrlUl.children).forEach(li=>li.addEventListener('click',()=>goTo(+li.dataset.idx)));

let navDragMoved=false, navDragStartX=0;
navUl.addEventListener('pointerdown', e=>{ navDragStartX=e.clientX; navDragMoved=false; });
navUl.addEventListener('pointermove', e=>{ if(Math.abs(e.clientX-navDragStartX)>8) navDragMoved=true; });
navUl.addEventListener('click', e=>{
  const li=e.target.closest('li[data-idx]');
  if(!li) return;
  const idx=+li.dataset.idx, href=li.dataset.href;
  if(navDragMoved){ e.preventDefault(); goTo(idx); return; }
  if(idx===current){ if(href){ e.preventDefault(); window.location.href=href; } }
  else { e.preventDefault(); goTo(idx); }
}, true);

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1);
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp'){ if(current===0) goToSecretAbout(); else goTo(current-1); }
});

let wCool=false;
window.addEventListener('wheel',e=>{
  if(wCool)return; wCool=true;
  if(e.deltaX>30||e.deltaY>30) goTo(current+1);
  else if(e.deltaX<-30||e.deltaY<-30){ if(current===0) goToSecretAbout(); else goTo(current-1); }
  setTimeout(()=>wCool=false,900);
},{passive:true});

let stageDragX=0, stageDragging=false, stageDelta=0;

document.getElementById('stage').addEventListener('pointerdown',e=>{
  stageDragging=true; stageDragX=e.clientX; stageDelta=0;
  e.preventDefault();
},{passive:false});

window.addEventListener('touchstart', e=>{
  stageDragging=true;
  stageDragX=e.touches[0].clientX;
  stageDelta=0;
},{passive:true});

window.addEventListener('touchmove', e=>{
  if(stageDragging) stageDelta=e.touches[0].clientX - stageDragX;
},{passive:true});

window.addEventListener('touchend', ()=>{
  if(!stageDragging) return;
  stageDragging=false;
  if(stageDelta < -50) goTo(current+1);
  else if(stageDelta > 50){ if(current===0) goToSecretAbout(); else goTo(current-1); }
  stageDelta=0;
});

window.addEventListener('pointermove',e=>{ if(stageDragging && e.pointerType!=='touch') stageDelta=e.clientX-stageDragX; });
window.addEventListener('pointerup',()=>{
  if(!stageDragging) return;
  stageDragging=false;
  if(stageDelta<-50) goTo(current+1);
  else if(stageDelta>50){ if(current===0) goToSecretAbout(); else goTo(current-1); }
  stageDelta=0;
});

const isTouchDevice = window.matchMedia('(pointer:coarse)').matches;

if(!isTouchDevice){
  const CURSOR_PARTICLE_SRC = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAATCAYAAACk9eypAAAAAXNSR0IArs4c6QAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAhGVYSWZNTQAqAAAACAAFARIAAwAAAAEAAQAAARoABQAAAAEAAABKARsABQAAAAEAAABSASgAAwAAAAEAAgAAh2kABAAAAAEAAABaAAAAAAAAAEgAAAABAAAASAAAAAEAA6ABAAMAAAABAAEAAKACAAQAAAABAAAADKADAAQAAAABAAAAEwAAAAAChpcNAAAACXBIWXMAAAsTAAALEwEAmpwYAAABWWlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyIgeDp4bXB0az0iWE1QIENvcmUgNS40LjAiPgogICA8cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPgogICAgICA8cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0iIgogICAgICAgICAgICB4bWxuczp0aWZmPSJodHRwOi8vbnMuYWRvYmUuY29tL3RpZmYvMS4wLyI+CiAgICAgICAgIDx0aWZmOk9yaWVudGF0aW9uPjE8L3RpZmY6T3JpZW50YXRpb24+CiAgICAgIDwvcmRmOkRlc2NyaXB0aW9uPgogICA8L3JkZjpSREY+CjwveDp4bXBtZXRhPgpMwidZAAABqElEQVQoFY3SPUvDQBgH8BREpRHExYiDgmLFl6WC+AYmWeyLg4i7buJX8DMpOujgyxGvUYeCgzhUQUSKKLUS0+ZyptXh8Z5Ti621ekPyJHl+uftfomhaf9Ei5JyxXKfynyEA6EYcLHpwyflT958GAQ7DTABNHd8EbtDbEH2BD5QEQmi2mM8P/Iq+A0SzszEg+3sPjDnDdVEtQKQbMUidHD3xVzf6A9UDEmEm+8h9KTqTVUjT+vB53aHrCbAPiceYq1dQI1Aqv4EhMll0jzv+Y0yiRgCnLRSYyDQHVoqUXe4uKL9l+L7GXC4vkMhE6eW/AOJs9k583ORDUyXMZ8F5SVHVVnllmPNKSFagAJ5DofaqGXw/gHBYg51dIldkmknY3tguv3jOtHR4+MqAzaraJXbEhqHhcQlwGSOi5pytVQHZLN5s0WNe8HPrLYlFsO20RPHkImxsbmHdLJFI76th7Z4SeuF53hTeFLvhRCJRCTKZKxgdnRDbW+iozFJbBMw14/ElwGYc0egMBMFzT21f5Rog33Z7dX02GBm7WV5ZfT5Nn5bE3zuCDe9UxdTpNvK+5AAAAABJRU5ErkJggg==';

  const CURSOR_PARTICLE_COUNT = 15;
  const CURSOR_RATE = 0.4;

  const cursorImage = new Image();
  cursorImage.src = CURSOR_PARTICLE_SRC;

  const trailCanvas = document.createElement('canvas');
  trailCanvas.id = 'trailing-cursor-canvas';
  trailCanvas.width = window.innerWidth;
  trailCanvas.height = window.innerHeight;
  document.body.appendChild(trailCanvas);
  const trailCtx = trailCanvas.getContext('2d');

  window.addEventListener('resize', ()=>{
    trailCanvas.width = window.innerWidth;
    trailCanvas.height = window.innerHeight;
  });

  let cursorPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
  let cursorParticles = [];
  let cursorParticlesInitted = false;

  window.addEventListener('mousemove', e=>{
    cursorPos.x = e.clientX;
    cursorPos.y = e.clientY;
    if(!cursorParticlesInitted){
      cursorParticlesInitted = true;
      for(let i=0;i<CURSOR_PARTICLE_COUNT;i++){
        cursorParticles.push({ x: cursorPos.x, y: cursorPos.y });
      }
    }
  });

  (function trailLoop(){
    requestAnimationFrame(trailLoop);
    trailCtx.clearRect(0,0,trailCanvas.width,trailCanvas.height);
    if(!cursorParticlesInitted || !cursorImage.complete) return;
    let x = cursorPos.x, y = cursorPos.y;
    cursorParticles.forEach((p, i)=>{
      const next = cursorParticles[i+1] || cursorParticles[0];
      p.x = x; p.y = y;
      trailCtx.drawImage(cursorImage, p.x, p.y);
      x += (next.x - p.x) * CURSOR_RATE;
      y += (next.y - p.y) * CURSOR_RATE;
    });
  })();
}

(function animate(ts){
  requestAnimationFrame(animate);
  uniforms.uTime.value=ts*0.001;
  if(uniforms.uBlend.value<1){
    const t=Math.min((ts-transitionStart)/TRANS_DUR,1);
    uniforms.uBlend.value=1-(1-t)*(1-t)*(1-t);
  }
  renderer.render(scene,camera);
})();

const AUTO_INTERVAL=12000;
let progressStart=0, autoRunning=false;
function resetProgress(){ progressStart=performance.now(); }
function startAutoAdvance(){
  if(autoRunning) return; autoRunning=true; progressStart=performance.now();
  (function tick(ts){
    requestAnimationFrame(tick);
    if(!autoRunning) return;
    const frac=Math.min((ts-progressStart)/AUTO_INTERVAL,1);
    if(frac>=1){ progressStart=ts; goTo((current+1)%TOTAL); }
  })();
}
ctrlUl.addEventListener('click',resetProgress);
navUl.addEventListener('click',resetProgress);
window.addEventListener('keydown',resetProgress);
window.addEventListener('wheel',resetProgress);
window.addEventListener('pointerup',resetProgress);
window.addEventListener('touchend',resetProgress);

const stageEl = document.getElementById('stage');
let mouseX=0, mouseY=0, tiltX=0, tiltY=0;
if(!isTouchDevice){
  window.addEventListener('mousemove', e=>{
    mouseX=(e.clientX/window.innerWidth-0.5)*2;
    mouseY=(e.clientY/window.innerHeight-0.5)*2;
  });
  window.addEventListener('mouseleave',()=>{ mouseX=0; mouseY=0; });
  (function tiltLoop(){
    requestAnimationFrame(tiltLoop);
    tiltX+=(mouseX-tiltX)*0.05; tiltY+=(mouseY-tiltY)*0.05;
    const rx=tiltY*4, ry=-tiltX*4, tx=tiltX*10, ty=tiltY*6;
    stageEl.style.transform=`perspective(1200px) rotateX(${rx}deg) rotateY(${ry}deg) translate(${tx}px,${ty}px)`;
  })();
}
</script>
