<!DOCTYPE html>
<html lang="ja-JP">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=0">
<title>SERVICES || LVO ♱⃓ᛪ༙</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
@font-face{font-family:'Baskerville Poster PT';src:local('Baskerville'),local('BaskervilleOldFace'),local('GFS Didot');font-weight:400;}

:root{
  --white:#fff;
  --black:#000;
  --dim:rgba(255,255,255,0.5);
  --dimmer:rgba(255,255,255,0.25);
}

html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Baskerville Poster PT','Times New Roman',Georgia,serif;
  cursor:none;
  user-select:none;
}

/* STAGE - WebGL canvas */
#stage{
  position:fixed;inset:0;z-index:0;
  background:#040006;
}
#stage canvas{
  width:100%!important;
  height:100%!important;
}

/* TITLE */
#title{
  position:fixed;
  top:0;left:0;right:0;
  z-index:30;
  padding:28px 40px;
}
#title a{
  text-decoration:none;
  color:var(--white);
  font-family:'Baskerville Poster PT','Times New Roman',serif;
  font-size:13px;
  letter-spacing:0.3em;
  display:inline-flex;align-items:center;gap:0;
  position:relative;
}
#title-indicator{
  display:inline-block;
  width:60px;height:1px;
  background:var(--white);
  margin-left:12px;
  transform-origin:left center;
  transform:scaleX(0.75);
  transition:transform 0.4s;
}
#title a:hover #title-indicator{transform:scaleX(1);}

/* STAGE NAV - horizontal sliding nav */
#stage-nav{
  position:fixed;
  top:50%;left:0;right:0;
  z-index:30;
  transform:translateY(-50%);
  overflow:hidden;
  pointer-events:none;
}
#screen-page-nav{
  display:flex;
  list-style:none;
  transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);
  will-change:transform;
}
#screen-page-nav li{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:all;
}
#screen-page-nav li a{
  text-decoration:none;
  color:var(--white);
  font-family:'Baskerville Poster PT','Times New Roman',serif;
  font-size:clamp(32px,5vw,68px);
  letter-spacing:0.02em;
  line-height:1;
  display:block;
  padding:0 20px;
  transition:opacity 0.4s;
  white-space:nowrap;
}
#screen-page-nav li.watashi{
  display:flex;align-items:center;justify-content:center;
}
#screen-page-nav li.watashi img{
  height:clamp(140px,22vw,320px);
  width:auto;
  object-fit:contain;
  opacity:0.85;
}

/* current/active state */
#screen-page-nav li a{opacity:0.3;}
#screen-page-nav li.is-current a{opacity:1;}
#screen-page-nav li:not(.watashi):hover a{opacity:0.7;}

/* progress indicator - thin line that grows across top */
#progress-indicator{
  position:fixed;
  top:0;left:0;
  z-index:40;
  height:1px;
  background:var(--white);
  width:100%;
  transform-origin:left center;
  transform:scaleX(0);
  transition:transform linear;
}

/* timer dots / indicator */
#timer-indicator{
  position:fixed;
  bottom:56px;left:0;right:0;
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  gap:0;
}

/* CONTROLLER - bottom scrubber */
#screen-controller{
  position:fixed;
  bottom:0;left:50%;
  z-index:30;
  transform:translateX(-50%);
  padding-bottom:20px;
  pointer-events:all;
}
#screen-controller .inner{
  position:relative;
  display:flex;align-items:flex-end;
}
#knob{
  position:absolute;
  bottom:0;left:0;
  display:flex;align-items:flex-end;
  gap:0;
  transition:transform 0.8s cubic-bezier(0.77,0,0.175,1);
  pointer-events:none;
  z-index:2;
}
.separator{
  display:block;
  width:1px;height:16px;
  background:var(--white);
  position:relative;
  bottom:-1px;
}
#nav-indicator{
  display:none;
}
.denominator{
  font-family:'Baskerville Poster PT','Times New Roman',serif;
  font-size:11px;
  font-weight:400;
  color:var(--dimmer);
  letter-spacing:0.1em;
  padding-left:6px;
  line-height:1;
  bottom:3px;
  position:relative;
}

#controller-parent{
  list-style:none;
  display:flex;
  align-items:flex-end;
  border-bottom:0.5px solid rgba(255,255,255,0.2);
  padding-bottom:0;
}
#controller-parent li{
  cursor:pointer;
  position:relative;
}
.numerator{
  display:block;
  font-family:'Baskerville Poster PT','Times New Roman',serif;
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--dimmer);
  padding:0 8px 8px;
  transition:color 0.3s;
  line-height:1;
}
#controller-parent li.is-current .numerator{
  color:var(--white);
}
.watashi .numerator{
  font-family:'Yu Mincho','游明朝','Hiragino Mincho ProN',serif;
}

/* CURSOR */
#waiting-cover-cursor{
  position:fixed;
  pointer-events:none;
  z-index:900;
  width:52px;height:52px;
  margin-left:-26px;margin-top:-26px;
}
#waiting-cover-cursor .inner{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
#waiting-cover-cursor img{
  width:26px;height:26px;
  animation:spin 1.8s linear infinite;
}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────
const SLIDES = [
  { label:'Beauty',    url:'/portfolio/beauty',     color:[0.08,0.08,0.15] },
  { label:'Editorial', url:'/portfolio/fashion',    color:[0.05,0.05,0.10] },
  { label:'Portrait',  url:'/portfolio/portrait',   color:[0.04,0.06,0.12] },
  { label:'Exhibition',url:'/portfolio/exhibition', color:[0.04,0.04,0.08] },
  { label:'私',        url:'/portfolio/biography',  color:[0.06,0.04,0.10] },
];
const TOTAL = SLIDES.length;

// ─── THREE.JS SETUP ───────────────────────────────────────────────────────
const canvas = document.querySelector('#stage canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// Full-screen quad geometry
const geo = new THREE.PlaneGeometry(2,2);

// Vertex shader
const vertSrc = `
varying vec2 vUv;
void main(){vUv=uv;gl_Position=vec4(position,1.0);}
`;

// Fragment shader — distortion + color effect
const fragSrc = `
precision highp float;
uniform float uTime;
uniform float uIndex;   // 0..4
uniform float uBlend;   // 0..1 transition progress
uniform float uPrev;    // previous index
uniform vec2  uRes;

varying vec2 vUv;

#define PI 3.14159265358979

// Palette per slide — dark moody tones
vec3 palette(float idx){
  if(idx<0.5) return vec3(0.04,0.06,0.20);
  if(idx<1.5) return vec3(0.03,0.03,0.14);
  if(idx<2.5) return vec3(0.03,0.05,0.16);
  if(idx<3.5) return vec3(0.02,0.02,0.10);
  return        vec3(0.04,0.02,0.12);
}

// Cheap noise
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}

// Glass / cell distortion
vec2 cellDistort(vec2 uv,float t,float idx){
  float scl=4.0+idx*1.5;
  vec2 q=vec2(fbm(uv*scl+vec2(0.0,t*0.07)),
               fbm(uv*scl+vec2(5.2,t*0.05)));
  vec2 r=vec2(fbm(uv*scl*1.4+4.0*q+vec2(1.7,9.2)+0.15*t),
               fbm(uv*scl*1.4+4.0*q+vec2(8.3,2.8)+0.126*t));
  return r;
}

void main(){
  vec2 uv=vUv;
  float t=uTime;

  // Distort UVs using fbm
  vec2 d=cellDistort(uv,t,uIndex);
  vec2 duv=uv+0.12*d;

  vec3 colA=palette(uIndex);
  vec3 colB=palette(uPrev);

  // animated internal gradient
  float grd=0.5+0.5*fbm(duv*3.0+t*0.04);
  float grd2=fbm(uv*1.5-t*0.02+vec2(d.x*2.0,d.y));

  vec3 colCurrent=colA*(0.5+0.5*grd)*0.8+colA*0.3*grd2*d.x;
  vec3 colPrev   =colB*(0.5+0.5*grd)*0.8+colB*0.3*grd2*d.y;

  // Wipe transition: displacement-based reveal
  float blend=uBlend;
  float dispBlend=blend+0.3*(d.x-0.5);
  dispBlend=clamp(dispBlend,0.0,1.0);
  vec3 col=mix(colPrev,colCurrent,dispBlend);

  // Subtle cell grid overlay (glass plate look)
  float cells=fbm(uv*12.0+d*0.5+t*0.01);
  col+=colA*0.04*cells;

  // Vignette
  vec2 vig=uv*2.0-1.0;
  float v=1.0-dot(vig,vig)*0.45;
  col*=v;

  // Film grain
  float grain=hash(uv*997.0+t*0.1)*0.04-0.02;
  col+=grain;

  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}
`;

const uniforms = {
  uTime:  { value:0 },
  uIndex: { value:3 },
  uPrev:  { value:3 },
  uBlend: { value:1 },
  uRes:   { value:new THREE.Vector2(window.innerWidth, window.innerHeight) },
};

const mat = new THREE.ShaderMaterial({ vertexShader:vertSrc, fragmentShader:fragSrc, uniforms });
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
}
resize();
window.addEventListener('resize', resize);

// ─── CAROUSEL STATE ───────────────────────────────────────────────────────
let current = 3;
let transitioning = false;
let transitionStart = 0;
const TRANS_DUR = 900; // ms

// Calculate slide width from viewport
function getSlideW(){ return window.innerWidth * 0.5; }

// NAV LAYOUT
const navUl  = document.getElementById('screen-page-nav');
const ctrlUl = document.getElementById('controller-parent');
const knob   = document.getElementById('knob');

function layoutNav(){
  const sw = getSlideW();
  const total = TOTAL;
  navUl.style.width = (sw*total)+'px';
  Array.from(navUl.children).forEach(li=>{
    li.style.width = sw+'px';
    li.style.height = '100px'; // just enough for centering
  });
}
layoutNav();
window.addEventListener('resize', layoutNav);

function updateNav(idx){
  // position nav so current item is centered
  const sw = getSlideW();
  const offset = sw * idx - (window.innerWidth/2 - sw/2);
  navUl.style.transform = `translateX(${-offset}px)`;

  // active classes
  Array.from(navUl.children).forEach((li,i)=>{
    li.classList.remove('is-current','is-prev','is-next');
    if(i===idx) li.classList.add('is-current');
    else if(i===idx-1) li.classList.add('is-prev');
    else if(i===idx+1) li.classList.add('is-next');
  });

  // controller
  Array.from(ctrlUl.children).forEach((li,i)=>{
    li.classList.toggle('is-current', i===idx);
  });

  // knob position — each numerator item is ~34px wide
  const itemW = ctrlUl.offsetWidth / TOTAL;
  knob.style.transform = `translateX(${idx*itemW}px)`;
}
updateNav(current);

function goTo(idx){
  if(idx<0||idx>=TOTAL||transitioning||idx===current) return;
  transitioning = true;
  const prev = current;
  current = idx;

  uniforms.uPrev.value = prev;
  uniforms.uIndex.value = idx;
  uniforms.uBlend.value = 0;
  transitionStart = performance.now();

  updateNav(idx);

  setTimeout(()=>{ transitioning=false; }, TRANS_DUR+100);
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────
// Controller clicks
Array.from(ctrlUl.children).forEach(li=>{
  li.addEventListener('click',()=>goTo(+li.dataset.idx));
});

// Nav item clicks
Array.from(navUl.children).forEach(li=>{
  li.addEventListener('click',e=>{
    if(!li.classList.contains('watashi')) e.preventDefault();
    goTo(+li.dataset.idx);
  });
});

// Keyboard
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')   goTo(current-1);
});

// Wheel
let wCool=false;
window.addEventListener('wheel',e=>{
  if(wCool) return;
  wCool=true;
  if(e.deltaX>30||e.deltaY>30) goTo(current+1);
  else if(e.deltaX<-30||e.deltaY<-30) goTo(current-1);
  setTimeout(()=>wCool=false, 900);
},{passive:true});

// Drag/swipe
let dragX=0,dragging=false,dDelta=0;
window.addEventListener('pointerdown',e=>{ dragging=true;dragX=e.clientX;dDelta=0; });
window.addEventListener('pointermove',e=>{ if(dragging) dDelta=e.clientX-dragX; });
window.addEventListener('pointerup',()=>{
  if(!dragging) return;
  dragging=false;
  if(dDelta<-60) goTo(current+1);
  else if(dDelta>60) goTo(current-1);
  dDelta=0;
});

// ─── CURSOR ───────────────────────────────────────────────────────────────
const cursor = document.getElementById('waiting-cover-cursor');
let cursorVisible = false;
window.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
  if(!cursorVisible){ cursor.style.opacity='0.9'; cursorVisible=true; }
});
window.addEventListener('mouseleave',()=>{ cursor.style.opacity='0'; cursorVisible=false; });

// ─── RENDER LOOP ──────────────────────────────────────────────────────────
function animate(ts){
  requestAnimationFrame(animate);

  uniforms.uTime.value = ts * 0.001;

  // Animate blend
  if(transitioning || uniforms.uBlend.value < 1){
    const elapsed = ts - transitionStart;
    const t = Math.min(elapsed / TRANS_DUR, 1);
    // ease out cubic
    const eased = 1-(1-t)*(1-t)*(1-t);
    uniforms.uBlend.value = eased;
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ─── PROGRESS BAR ─────────────────────────────────────────────────────────
const progressBar = document.getElementById('progress-indicator');
const AUTO_INTERVAL = 6000;
let progressStart = performance.now();

function tickProgress(ts){
  requestAnimationFrame(tickProgress);
  const elapsed = ts - progressStart;
  const frac = Math.min(elapsed / AUTO_INTERVAL, 1);
  progressBar.style.transform = `scaleX(${frac})`;
  if(frac >= 1){
    progressStart = ts;
    goTo((current+1) % TOTAL);
  }
}
requestAnimationFrame(tickProgress);

// Reset progress on manual nav
function resetProgress(){
  progressStart = performance.now();
}
ctrlUl.addEventListener('click', resetProgress);
navUl.addEventListener('click', resetProgress);
window.addEventListener('keydown', resetProgress);
window.addEventListener('wheel', resetProgress);
window.addEventListener('pointerup', resetProgress);
</script>
</body>
